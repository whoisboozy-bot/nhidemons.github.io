            const input = document.getElementById('passcodeInput').value;
            const errorMsg = document.getElementById('passcodeError');
            
            if (input === CORRECT_PASSCODE) {
                document.getElementById('passcodeBox').classList.add('hidden');
                document.getElementById('giftArea').classList.remove('hidden');
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function openGift() {
            const giftCard = document.getElementById('giftCard');
            giftCard.classList.remove('hidden');
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        function sendFeedback(choice) {
            let message = "";
            if (choice === 'forgive') {
                message = encodeURIComponent("Em đọc web 20/10 của anh rồi... Em bớt giận chút rồi đó! 🌸");
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                message = encodeURIComponent("Em đọc web rồi, nhưng em vẫn cần thêm thời gian suy nghĩ nhé.");
            }

            setTimeout(() => {
                const zaloUrl = `https://zalo.me/${YOUR_ZALO_PHONE}?text=${message}`;
                window.open(zaloUrl, '_blank');
            }, 1000);
        }

        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('musicIcon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicIcon.className = "fas fa-music text-lg";
            } else {
                bgMusic.play();
                musicIcon.className = "fas fa-pause text-lg text-accentRose";
            }
            isPlaying = !isPlaying;
        }

        const voiceAudio = document.getElementById('voiceAudio');
        const voicePlayIcon = document.getElementById('voicePlayIcon');
        const voiceProgress = document.getElementById('voiceProgress');
        const voiceTime = document.getElementById('voiceTime');

        function toggleVoiceNote() {
            if (voiceAudio.paused) {
                voiceAudio.play();
                voicePlayIcon.className = "fas fa-pause";
            } else {
                voiceAudio.pause();
                voicePlayIcon.className = "fas fa-play";
            }
        }

        voiceAudio.ontimeupdate = function() {
            const pct = (voiceAudio.currentTime / voiceAudio.duration) * 100;
            voiceProgress.style.width = pct + "%";
            
            let curMin = Math.floor(voiceAudio.currentTime / 60);
            let curSec = Math.floor(voiceAudio.currentTime % 60);
            if (curSec < 10) curSec = "0" + curSec;
            
            let durMin = Math.floor(voiceAudio.duration / 60) || 0;
            let durSec = Math.floor(voiceAudio.duration % 60) || 0;
            if (durSec < 10) durSec = "0" + durSec;

            voiceTime.innerText = `${curMin}:${curSec} / ${durMin}:${durSec}`;
        };

        window.onscroll = function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";

            const reveals = document.querySelectorAll('.reveal');
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                const elementVisible = 100;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add('active');
                }
            }
        };
    </script>
</body>
</html>
